name: Quadrotor CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile Core Headers
        run: |
          g++ -xc++ -std=c++17 -Wall -fsyntax-only core/pid_controller.hpp
          g++ -xc++ -std=c++17 -Wall -fsyntax-only core/experimental_pd.hpp
